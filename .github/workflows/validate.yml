name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions match and have a changelog entry
        run: |
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          manifest=$(python3 -c 'import json; print(json.load(open("custom_components/pc_pulse/manifest.json"))["version"])')
          [ "$cargo" = "$manifest" ] || { echo "Cargo.toml ($cargo) and manifest.json ($manifest) disagree"; exit 1; }
          grep -q "^## \[$cargo\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $cargo"; exit 1; }
          grep -q "^## \[Unreleased\]" CHANGELOG.md || { echo "CHANGELOG.md has no Unreleased section"; exit 1; }

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings
      - run: cargo build

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest -q

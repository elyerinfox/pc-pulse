# pc-pulse agent configuration.
# The agent creates this file on first run (see `pc-pulse info` for its location).

# Stable id used by Home Assistant. Don't change it after adding the computer.
id = "generated-on-first-run"
# Name shown in Home Assistant.
name = "Gaming PC"

bind = "0.0.0.0"
port = 8752
# Home Assistant must send this token. Rotate with `pc-pulse regenerate-token`.
token = "generated-on-first-run"

# Seconds between samples.
refresh_interval_secs = 2
# How many top processes (by CPU and memory) to report.
top_processes = 10
# Seconds without keyboard/mouse input before the user counts as inactive.
active_threshold_secs = 300
# Advertise the agent so Home Assistant discovers it automatically.
mdns = true

# Allow shutdown, restart, sleep, hibernate, lock, log off and display control.
allow_power = true
# Allow killing processes.
allow_kill = true
# Allow Home Assistant to show desktop notifications.
allow_notify = true

# Install new releases from GitHub automatically. The agent checks once every
# update_check_hours using GitHub's public API. Set update_repo = "" to disable
# update checks entirely (Home Assistant then can't install updates either).
auto_update = true
update_repo = "elyerinfox/pc-pulse"
update_check_hours = 24

# Hours between checks for pending OS updates (Windows Update, apt/dnf/pacman,
# macOS softwareupdate). 0 turns the check off.
os_update_check_hours = 6

# Commands Home Assistant may run. Each becomes a button. Only these can be run.
[commands]
open_steam = "start steam://open/main"
# Linux example: lock_and_mute = "loginctl lock-session && pactl set-sink-mute @DEFAULT_SINK@ 1"
